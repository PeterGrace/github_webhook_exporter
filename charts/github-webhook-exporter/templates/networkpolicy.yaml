{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-webhook-exporter.fullname" . }}
  labels:
    {{- include "github-webhook-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-webhook-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $hasIngress := false }}
    {{- range $rule := .Values.networkPolicy.ingress }}
    {{- if $rule.enabled }}
    {{- $hasIngress = true }}
    - from:
        - namespaceSelector:
            {{- toYaml $rule.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $rule.podSelector | nindent 12 }}
      ports:
        # Every purpose-specific Service targets this shared container listener.
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
    {{- if not $hasIngress }} []{{- end }}
  egress:
    {{- $dns := .Values.networkPolicy.egress.dns }}
    {{- $otlp := .Values.networkPolicy.egress.otlp }}
    {{- $github := .Values.networkPolicy.egress.github }}
    {{- if $dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml $dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if $otlp.enabled }}
    - to:
        {{- include "github-webhook-exporter.egressPeers" $otlp.peers | nindent 8 }}
      ports:
        {{- range $port := $otlp.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
    {{- if $github.enabled }}
    # Reaching the GitHub REST API is what fills the branch-protection required-check cache.
    - to:
        {{- include "github-webhook-exporter.egressPeers" $github.peers | nindent 8 }}
      ports:
        {{- range $port := $github.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
    {{- if and (not $dns.enabled) (not $otlp.enabled) (not $github.enabled) }} []{{- end }}
{{- end }}
