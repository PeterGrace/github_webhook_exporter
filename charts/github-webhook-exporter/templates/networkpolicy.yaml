{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-webhook-exporter.fullname" . }}
  labels:
    {{- include "github-webhook-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-webhook-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $hasIngress := false }}
    {{- range $rule := .Values.networkPolicy.ingress }}
    {{- if $rule.enabled }}
    {{- $hasIngress = true }}
    - from:
        - namespaceSelector:
            {{- toYaml $rule.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $rule.podSelector | nindent 12 }}
      ports:
        # Every purpose-specific Service targets this shared container listener.
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
    {{- if not $hasIngress }} []{{- end }}
  egress:
    {{- $dns := .Values.networkPolicy.egress.dns }}
    {{- $otlp := .Values.networkPolicy.egress.otlp }}
    {{- if $dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml $dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if $otlp.enabled }}
    - to:
        {{- range $peer := $otlp.peers }}
        - {{- with $peer.ipBlock }}
          ipBlock:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          namespaceSelector:
            {{- toYaml $peer.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $peer.podSelector | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        {{- range $port := $otlp.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
    {{- if and (not $dns.enabled) (not $otlp.enabled) }} []{{- end }}
{{- end }}
