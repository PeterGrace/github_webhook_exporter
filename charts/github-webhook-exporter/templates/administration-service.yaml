{{- if .Values.administration.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-webhook-exporter.fullname" . }}-administration
  labels:
    {{- include "github-webhook-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: administration
  {{- with .Values.administration.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "github-webhook-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.administration.service.port }}
      protocol: TCP
      targetPort: http
{{- end }}
