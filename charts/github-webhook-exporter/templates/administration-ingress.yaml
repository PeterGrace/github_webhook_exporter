{{- if .Values.administration.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "github-webhook-exporter.fullname" . }}-administration
  labels:
    {{- include "github-webhook-exporter.labels" . | nindent 4 }}
  {{- with .Values.administration.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.administration.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.administration.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.administration.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1/repositories
            pathType: Prefix
            backend:
              service:
                name: {{ include "github-webhook-exporter.fullname" . }}-administration
                port:
                  name: http
{{- end }}
