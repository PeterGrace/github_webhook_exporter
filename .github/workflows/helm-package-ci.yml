name: Helm package CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_IMAGE: github-webhook-exporter:ci
      KIND_ARTIFACT_DIRECTORY: dist/kind-lifecycle
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned CI tools
        run: scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"

      - name: Add CI tools to PATH
        run: echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify workflow contract
        run: just workflow-test

      - name: ShellCheck tracked shell scripts
        run: |
          mapfile -t shell_files < <(git ls-files -- '*.sh')
          shellcheck "${shell_files[@]}"

      - name: Validate Helm chart contracts
        run: just helm-static

      - name: Smoke test the production image
        run: just image-smoke

      - name: Exercise lifecycle and persistence in Kind
        run: just helm-kind-lifecycle

      - name: Verify Rust formatting
        run: just fmt

      - name: Build the project
        run: cargo build --locked

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: just test

      - name: Generate documentation
        run: cargo doc --no-deps --locked

      - name: Upload packaged Helm chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helm-package
          path: dist/github-webhook-exporter-0.1.0.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Kind lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-lifecycle-diagnostics
          path: dist/kind-lifecycle
          if-no-files-found: warn
          retention-days: 14

  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate release version alignment
        id: version
        run: |
          version="$(scripts/release-version.sh "$GITHUB_REF_NAME")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/petergrace/github-webhook-exporter
          tags: type=raw,value=${{ steps.version.outputs.version }}
          flavor: latest=false

      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

      - name: Smoke test the release image
        env:
          RELEASE_IMAGE: ghcr.io/petergrace/github-webhook-exporter:${{ steps.version.outputs.version }}
        run: scripts/container-smoke.sh "$RELEASE_IMAGE"

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing versioned image tag
        env:
          RELEASE_IMAGE: ghcr.io/petergrace/github-webhook-exporter:${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
              printf 'release image already exists: %s\n' "$RELEASE_IMAGE" >&2
              exit 1
          fi

      - name: Publish the versioned image tag
        env:
          RELEASE_IMAGE: ghcr.io/petergrace/github-webhook-exporter:${{ steps.version.outputs.version }}
        run: docker push "$RELEASE_IMAGE"
