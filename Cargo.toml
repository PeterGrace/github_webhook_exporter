[package]
name = "github_webhook_exporter"
version = "0.1.1"
edition = "2021"
authors = ["Peter Grace <pete.grace@gmail.com>"]

# Keep the Helm chart in lockstep with the crate; scripts/release-version.sh
# rejects a release tag whose Cargo, chart, and appVersion values disagree. The
# chart README carries pinned install examples, so those are rewritten too; the
# test suites derive the version instead of hard-coding it.
[package.metadata.release]
pre-release-replacements = [
    { file = "charts/github-webhook-exporter/Chart.yaml", search = "(?m)^version: .*$", replace = "version: {{version}}", exactly = 1 },
    { file = "charts/github-webhook-exporter/Chart.yaml", search = "(?m)^appVersion: .*$", replace = "appVersion: \"{{version}}\"", exactly = 1 },
    { file = "charts/github-webhook-exporter/README.md", search = "github-webhook-exporter:[0-9]+\\.[0-9]+\\.[0-9]+", replace = "github-webhook-exporter:{{version}}", min = 1 },
    { file = "charts/github-webhook-exporter/README.md", search = "--version [0-9]+\\.[0-9]+\\.[0-9]+", replace = "--version {{version}}", min = 1 },
    { file = "charts/github-webhook-exporter/README.md", search = "github-webhook-exporter-[0-9]+\\.[0-9]+\\.[0-9]+\\.tgz", replace = "github-webhook-exporter-{{version}}.tgz", min = 1 },
    { file = "charts/github-webhook-exporter/README.md", search = "currently `[0-9]+\\.[0-9]+\\.[0-9]+`", replace = "currently `{{version}}`", exactly = 1 },
    { file = "docs/operations.md", search = "github-webhook-exporter:[0-9]+\\.[0-9]+\\.[0-9]+", replace = "github-webhook-exporter:{{version}}", min = 1 },
    { file = "docs/operations.md", search = "--version [0-9]+\\.[0-9]+\\.[0-9]+", replace = "--version {{version}}", min = 1 },
    { file = "docs/operations.md", search = "github-webhook-exporter-[0-9]+\\.[0-9]+\\.[0-9]+\\.tgz", replace = "github-webhook-exporter-{{version}}.tgz", min = 1 },
    { file = "docs/operations.md", search = "version fields are `[0-9]+\\.[0-9]+\\.[0-9]+`", replace = "version fields are `{{version}}`", exactly = 1 },
    { file = "README.md", search = "github-webhook-exporter:[0-9]+\\.[0-9]+\\.[0-9]+", replace = "github-webhook-exporter:{{version}}", exactly = 1 },
    { file = "README.md", search = "--version [0-9]+\\.[0-9]+\\.[0-9]+", replace = "--version {{version}}", exactly = 1 },
]

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing"] }
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-http = { version = "0.32", default-features = false, features = ["reqwest-blocking"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
percent-encoding = "2"
prometheus-client = { version = "0.25.0", default-features = false }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
secrecy = "0.10"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
subtle = "2.6"
thiserror = "2.0.6"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
