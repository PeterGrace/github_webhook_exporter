[package]
name = "github_webhook_exporter"
version = "0.1.0"
edition = "2021"
authors = ["Peter Grace <pete.grace@gmail.com>"]

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
secrecy = "0.10"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
subtle = "2.6"
thiserror = "2.0.6"
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
